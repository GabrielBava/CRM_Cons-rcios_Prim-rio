# Conector do WhatsApp Lite (Evolution API v2) para o CRM Vero Consórcios.
# Sobe 4 serviços: a Evolution API, o banco (Postgres), o cache (Redis) e o Caddy (HTTPS automático no domínio).
# Configuração em .env (criado pelo instalar-evolution.sh). Não publique o .env: ele tem a chave do servidor.
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.8
    container_name: evolution_api
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - evolution_instances:/evolution/instances
    expose:
      - "8080"

  postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7
    container_name: evolution_redis
    restart: always
    command: ["redis-server", "--port", "6379", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    expose:
      - "6379"

  caddy:
    image: caddy:2
    container_name: evolution_caddy
    restart: always
    depends_on:
      - evolution-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  evolution_instances:
  postgres_data:
  evolution_redis:
  caddy_data:
  caddy_config:
